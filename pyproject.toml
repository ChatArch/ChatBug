[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatBug"
dynamic = ["version"]
description = "ChatArch reserved Python package for future bug investigation tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0", "chatstyle>=0.2.0,<0.3.0", "chatenv>=0.2.11,<0.3.0"]
authors = [{name = "ChatArch", email = "rex@chatarch.org"}]
keywords = ["chatbug", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatBug"
Repository = "https://github.com/ChatArch/ChatBug"
Documentation = "https://arch.gh.wzhecnu.cn/ChatBug/"

[project.scripts]
chatbug = "chatbug.cli:main"

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<9.7", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatbug.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
